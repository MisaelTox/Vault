services:

  backend:
    build: ./vault-backend
    env_file:
      - ./vault-backend/.env
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./vault-frontend
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
